name: Build Android Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java Environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create Temporary Debug Keystore
        run: |
          cd android
          keytool -genkey -v -keystore debug.keystore \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          ls -l debug.keystore

      - name: Generate Gradle Wrapper & Build APK
        run: |
          cd android
          gradle wrapper --gradle-version 8.8
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK Output
        run: |
          ls -la android/app/build/outputs/apk/debug/app-debug.apk || find android -name "*.apk"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
